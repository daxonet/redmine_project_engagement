services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: redmine
      MYSQL_DATABASE: redmine
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - /tmp/redmine_sql/tracker_2026-04-02_16-22-23.sql:/docker-entrypoint-initdb.d/01-import.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-predmine", "redmine", "-e", "SELECT 1 FROM versions LIMIT 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  redmine:
    image: redmine:6.0
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3081:3000"
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_PORT: 3306
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: root
      REDMINE_DB_PASSWORD: redmine
    volumes:
      - ./:/usr/src/redmine/plugins/redmine_project_engagement
      - redmine_files:/usr/src/redmine/files

volumes:
  mysql_data:
  redmine_files:
